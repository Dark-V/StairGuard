name: Windows build

on:
  push:
    branches: [main, 'feature/**']
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Polygon ROI geometry tests
        run: dotnet run --project tests/GeometryTests.csproj -c Release

      - name: Trigger history image and journal tests
        run: dotnet run --project tests/TriggerHistoryTests.csproj -c Release

      - name: Restore packages
        run: dotnet restore src/StairGuard.csproj -r win-x64 --configfile NuGet.Config -p:SelfContained=true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true

      - name: Publish Windows executable
        run: dotnet publish src/StairGuard.csproj --no-restore -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishTrimmed=false -p:PublishAot=false -p:DebugType=None -p:DebugSymbols=false -o publish

      - name: Package compiled release
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath StairGuard-win-x64-self-contained.zip

      - name: Package source code
        shell: pwsh
        run: git archive --format=zip --output=StairGuard-source.zip HEAD

      - name: Upload CI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: StairGuard-builds
          path: |
            StairGuard-win-x64-self-contained.zip
            StairGuard-source.zip
          retention-days: 30

      - name: Create GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v1.7.0-ci.{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('StairGuard {0}', github.ref_name) || format('StairGuard v1.7 CI build {0}', github.run_number) }}
          prerelease: ${{ github.ref == 'refs/heads/main' }}
          files: |
            StairGuard-win-x64-self-contained.zip
            StairGuard-source.zip
          generate_release_notes: true
